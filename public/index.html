    <title>SuperSite - Premium Web Agency</title>

        "addressRegion": "Grand Casablanca",

        "addressCountry": "MA"

      "geo": {
        "@type": "GeoCoordinates",

        "areaServed": "MA",
        "availableLanguage": ["French", "Arabic", "English"]
